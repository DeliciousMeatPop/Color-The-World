# Point root at the public/ folder only. storage/, engine/ and config.json stay private.
server {
    listen 80;
    server_name colorthe.example;
    root /path/to/Color-The-World/public;
    index index.php;
    client_max_body_size 40m;
    fastcgi_read_timeout 300s;

    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;   # adjust to your PHP-FPM
    }
}
